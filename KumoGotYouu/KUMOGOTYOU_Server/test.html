<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multisim Logic Circuit Simulator</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #1e1e24; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; background-color: #2b2b36; padding: 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { margin-top: 0; color: #4da6ff; font-size: 1.5rem; text-align: center; }
        .main-layout { display: flex; gap: 20px; margin-top: 20px; flex-wrap: wrap; }
        .circuit-panel { flex: 1.5; min-width: 450px; background: #ffffff; border-radius: 6px; padding: 20px; color: #000; position: relative; }
        .scope-panel { flex: 1; min-width: 320px; background: #111; border: 2px solid #444; border-radius: 6px; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        
        /* Schematic Styling */
        svg { width: 100%; height: 320px; }
        .wire { fill: none; stroke: #cc0000; stroke-width: 2.5; stroke-linecap: round; }
        .wire-off { stroke: #555; }
        .wire-on { stroke: #00cc44; }
        .gate { fill: #ffffff; stroke: #0000bb; stroke-width: 2.5; }
        .gate-text { font-weight: bold; font-size: 12px; fill: #0000bb; }
        .label { font-size: 11px; fill: #333; font-weight: bold; }

        /* Controls */
        .controls-overlay { display: flex; justify-content: space-around; background: #eef2f5; padding: 10px; border-radius: 4px; margin-bottom: 10px; border: 1px solid #ccc; }
        .switch-btn { padding: 8px 16px; font-weight: bold; cursor: pointer; border: none; border-radius: 4px; color: #fff; transition: background 0.2s; }
        .switch-off { background-color: #d9534f; }
        .switch-on { background-color: #5cb85c; }

        /* Oscilloscope */
        .scope-title { color: #aaa; font-size: 0.9rem; margin-bottom: 10px; width: 100%; text-align: left; border-bottom: 1px solid #333; padding-bottom: 5px; }
        canvas { background-color: #000; border: 1px solid #228b22; width: 100%; height: 220px; }
        .scope-info { font-family: monospace; font-size: 0.85rem; color: #00ff00; margin-top: 10px; width: 100%; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

<div class="container">
    <h1>Digital Logic Schematic & Oscilloscope Simulator</h1>

    <div class="controls-overlay">
        <div>
            <strong>Switch J1 (Input 1):</strong> 
            <button id="j1-btn" class="switch-btn switch-off" onclick="toggleSwitch('J1')">Position: LOW (GND)</button>
        </div>
        <div>
            <strong>Switch J2 (Input 2):</strong> 
            <button id="j2-btn" class="switch-btn switch-off" onclick="toggleSwitch('J2')">Position: LOW (GND)</button>
        </div>
    </div>

    <div class="main-layout">
        <div class="circuit-panel">
            <svg viewBox="0 0 500 300">
                <text x="20" y="30" class="label">V1: 12V</text>
                <line x1="15" y1="35" x2="45" y2="35" stroke="#000" stroke-width="2"/>
                <line x1="25" y1="40" x2="35" y2="40" stroke="#000" stroke-width="2"/>
                
                <text x="20" y="270" class="label">GND (0V)</text>
                <line x1="15" y1="275" x2="45" y2="275" stroke="#000" stroke-width="2"/>

                <path d="M 30,35 L 30,80 L 70,80" fill="none" stroke="#666" stroke-width="2"/>
                <path d="M 30,35 L 30,180 L 70,180" fill="none" stroke="#666" stroke-width="2"/>
                <path d="M 30,275 L 30,120 L 70,120" fill="none" stroke="#666" stroke-width="2"/>
                <path d="M 30,275 L 30,220 L 70,220" fill="none" stroke="#666" stroke-width="2"/>

                <text x="75" y="70" class="label">J1 (Space)</text>
                <text x="75" y="170" class="label">J2 (Space)</text>

                <path id="wire-a" class="wire" d="M 110,100 L 160,100 L 160,75 L 200,75"/>
                <path id="wire-b" class="wire" d="M 110,200 L 160,200 L 160,175 L 200,175"/>
                <path class="wire wire-off" d="M 30,275 L 180,275 L 180,105 L 200,105"/>
                <path class="wire wire-off" d="M 30,275 L 180,275 L 180,205 L 200,205"/>

                <circle cx="70" cy="80" r="4" fill="#000"/>
                <circle cx="70" cy="120" r="4" fill="#000"/>
                <line id="sw-j1" x1="110" y1="100" x2="70" y2="120" stroke="#000" stroke-width="3"/>

                <circle cx="70" cy="180" r="4" fill="#000"/>
                <circle cx="70" cy="220" r="4" fill="#000"/>
                <line id="sw-j2" x1="110" y1="200" x2="70" y2="220" stroke="#000" stroke-width="3"/>

                <path class="gate" d="M 200,60 Q 220,90 200,120 Q 230,120 250,90 Q 230,60 200,60 Z"/>
                <text x="205" y="94" class="gate-text">74HC32N</text>
                <text x="205" y="52" class="label">U1A</text>

                <path class="gate" d="M 200,160 Q 220,190 200,220 Q 230,220 250,190 Q 230,160 200,160 Z"/>
                <text x="205" y="194" class="gate-text">74HC32N</text>
                <text x="205" y="152" class="label">U2B</text>

                <path id="wire-u1a-out" class="wire" d="M 250,90 L 300,90 L 300,130 L 320,130"/>
                <path id="wire-u2b-out" class="wire" d="M 250,190 L 300,190 L 300,150 L 320,150"/>

                <path class="gate" d="M 320,120 L 340,120 A 20,20 0 0,1 340,160 L 320,160 Z"/>
                <text x="323" y="144" class="gate-text" style="font-size: 10px;">74HC08D</text>
                <text x="323" y="112" class="label">U3A</text>

                <path id="wire-out" class="wire" d="M 360,140 L 420,140"/>

                <rect x="420" y="100" width="60" height="70" rx="5" fill="#e1e1e1" stroke="#333" stroke-width="2"/>
                <rect x="428" y="108" width="44" height="30" fill="#111" stroke="#555"/>
                <path d="M 430,123 Q 440,110 450,123 T 470,123" fill="none" stroke="#00ff00" stroke-width="1.5"/>
                <text x="430" y="155" class="label" style="font-size:9px;">XSC1</text>
                <circle cx="430" cy="163" r="3" fill="#cc0000"/>
                <circle cx="470" cy="163" r="3" fill="#000"/>
            </svg>
        </div>

        <div class="scope-panel">
            <div class="scope-title">Oscilloscope - XSC1</div>
            <canvas id="scopeCanvas" width="300" height="200"></canvas>
            <div class="scope-info">
                <span>Channel A: Output</span>
                <span id="voltage-readout">0.00 V</span>
            </div>
        </div>
    </div>
</div>

<script>
    // State Logic
    const state = {
        j1: false, // false = LOW (GND), true = HIGH (12V)
        j2: false
    };

    // DOM Elements
    const j1Btn = document.getElementById('j1-btn');
    const j2Btn = document.getElementById('j2-btn');
    const swJ1 = document.getElementById('sw-j1');
    const swJ2 = document.getElementById('sw-j2');
    
    const wireA = document.getElementById('wire-a');
    const wireB = document.getElementById('wire-b');
    const wireU1A = document.getElementById('wire-u1a-out');
    const wireU2B = document.getElementById('wire-u2b-out');
    const wireOut = document.getElementById('wire-out');
    const voltageReadout = document.getElementById('voltage-readout');

    // Canvas Oscilloscope setup
    const canvas = document.getElementById('scopeCanvas');
    const ctx = canvas.getContext('2d');
    const history = new Array(canvas.width).fill(0);

    function toggleSwitch(sw) {
        if (sw === 'J1') {
            state.j1 = !state.j1;
            j1Btn.className = switch-btn ${state.j1 ? 'switch-on' : 'switch-off'};
            j1Btn.innerText = Position: ${state.j1 ? 'HIGH (12V)' : 'LOW (GND)'};
            swJ1.setAttribute('y2', state.j1 ? '80' : '120');
        } else if (sw === 'J2') {
            state.j2 = !state.j2;
            j2Btn.className = switch-btn ${state.j2 ? 'switch-on' : 'switch-off'};
            j2Btn.innerText = Position: ${state.j2 ? 'HIGH (12V)' : 'LOW (GND)'};
            swJ2.setAttribute('y2', state.j2 ? '180' : '220');
        }
        updateCircuit();
    }

    // Keyboard controls (Spacebar toggle as noted in Multisim setup)
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
            e.preventDefault();
            toggleSwitch('J1');
            toggleSwitch('J2');
        }
    });

    function updateCircuit() {
        // Logic operations: 
        // U1A (OR Gate): J1 OR 0 (GND) -> J1
        // U2B (OR Gate): J2 OR 0 (GND) -> J2
        // U3A (AND Gate): U1A AND U2B -> J1 AND J2
        const u1aOut = state.j1 || false;
        const u2bOut = state.j2 || false;
        const finalOut = u1aOut && u2bOut;

        // Visual Wire Colors Update
        wireA.className.baseVal = wire ${state.j1 ? 'wire-on' : 'wire-off'};
        wireB.className.baseVal = wire ${state.j2 ? 'wire-on' : 'wire-off'};
        wireU1A.className.baseVal = wire ${u1aOut ? 'wire-on' : 'wire-off'};
        wireU2B.className.baseVal = wire ${u2bOut ? 'wire-on' : 'wire-off'};
        wireOut.className.baseVal = wire ${finalOut ? 'wire-on' : 'wire-off'};

        // Voltage text readout (Simulated Digital standard ~5V HIGH, 0V LOW)
        voltageReadout.innerText = finalOut ? "5.00 V" : "0.00 V";
        voltageReadout.style.color = finalOut ? "#00ff00" : "#ff3333";
    }

    function drawScope() {
        // Calculate current logic state
        const currentVal = (state.j1 && state.j2) ? 1 : 0;
        
        // Push current output state into array history
        history.push(currentVal);
        history.shift();

        // Clear Background
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw Oscilloscope Grid Lines
        ctx.strokeStyle = '#003300';
        ctx.lineWidth = 1;

        for (let x = 0; x < canvas.width; x += 30) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, canvas.height);
            ctx.stroke();
        }
        for (let y = 0; y < canvas.height; y += 30) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(canvas.width, y);
            ctx.stroke();
        }

        // Draw Live Trace Waveform
        ctx.strokeStyle = '#00ff00';
        ctx.lineWidth = 2.5;
        ctx.beginPath();

        for (let i = 0; i < history.length; i++) {
            // Scale logic 0/1 to Canvas height (Y=160 for LOW, Y=40 for HIGH)
            const y = history[i] === 1 ? 40 : 160;
            if (i === 0) {
                ctx.moveTo(i, y);
            } else {
                ctx.lineTo(i, y);
            }
        }
        ctx.stroke();

        requestAnimationFrame(drawScope);
    }

    // Initialize Circuit & Start Canvas Loop
    updateCircuit();
    drawScope();
</script>

</body>
</html>
